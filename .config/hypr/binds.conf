# Mod / Leader key

$term = kitty
$browser = librewolf
$mail = evolution
$launchpad = sherlock
$editor = geany
$explorer = nemo
$music = audacious
$launchpad =  pkill sherlock || sherlock
$looking-glass = looking-glass-client


# ░█▀█░█▀█░█▀█░░░█░░░█▀█░█░█░█▀█░█▀▀░█░█░█▀▀░█▀▄░█▀▀
# ░█▀█░█▀▀░█▀▀░░░█░░░█▀█░█░█░█░█░█░░░█▀█░█▀▀░█▀▄░▀▀█
# ░▀░▀░▀░░░▀░░░░░▀▀▀░▀░▀░▀▀▀░▀░▀░▀▀▀░▀░▀░▀▀▀░▀░▀░▀▀▀
bind = SUPER, RETURN, exec, $term 
bind = SUPER, Q, killactive,
bind = SUPER_SHIFT, P, exec, hyprpicker -a && (convert -size 32x32 xc:$(wl-paste) /tmp/color.png && notify-send "Color Code:" "$(wl-paste)" -h "string:bgcolor:$(wl-paste)" --icon /tmp/color.png -u critical -t 4000)
bind = SUPER, E, exec, $explorer
bind = SUPER_SHIFT, M, exec, $mail
bind = SUPER_SHIFT, SPACE, exec, $launcher_alt
bind = SUPER, L, exec, swaylock -f -c 333333
bind = SUPER, D, exec, $launchpad


# ░█▀▀░█░█░█▀▀░▀█▀░█▀▀░█▄█
# ░▀▀█░░█░░▀▀█░░█░░█▀▀░█░█
# ░▀▀▀░░▀░░▀▀▀░░▀░░▀▀▀░▀░▀
bind = SUPER, Escape, exec, dunstctl close
bind = SUPER, H, exec, dunstctl history-pop

# ░█▀▀░█▀▀░█▀▄░█▀▀░█▀▀░█▀█░█▀▀░█░█░█▀█░▀█▀
# ░▀▀█░█░░░█▀▄░█▀▀░█▀▀░█░█░▀▀█░█▀█░█░█░░█░
# ░▀▀▀░▀▀▀░▀░▀░▀▀▀░▀▀▀░▀░▀░▀▀▀░▀░▀░▀▀▀░░▀░
# Pictures
#bind = SUPER_SHIFT, S, exec, hyprshot -m region -o $HOME/Pictures/Screenshots
#bind = SUPER_SHIFT, S, exec, ~/scripts/hyprland_binds/flameshot.sh
#bind = , Print, exec, \$HOME/scripts/screenshot.sh
bind = $SUPER SHIFT, S, exec, grim -g "$(slurp -d)" - | satty -f - -o ~/Screenshots/%Y-%m-%d_%H:%M:%S.png --save-after-copy

# ░█░░░█▀█░█░█░█▀█░█░█░▀█▀
# ░█░░░█▀█░░█░░█░█░█░█░░█░
# ░▀▀▀░▀░▀░░▀░░▀▀▀░▀▀▀░░▀░
bind = SUPER_SHIFT, Return, togglefloating,
bind = $SUPER SHIFT, space, togglefloating
bind = SUPER, F, fullscreen,1
#bind = SUPER, Tab,  hy3:makegroup, tab, force_ephemeral
#bind = SUPER, up,  hy3:changegroup, f
#bind = SUPER, down, hy3:changegroup, b

# ░█░█░▀█▀░█▀█░█▀▄░█▀█░█░█
# ░█▄█░░█░░█░█░█░█░█░█░█▄█
# ░▀░▀░▀▀▀░▀░▀░▀▀░░▀▀▀░▀░▀
# WINDOWS FOCUS
bind = SUPER,a,movefocus,l
bind = SUPER,s,movefocus,r
bind = SUPER,up,movefocus,u
bind = SUPER,down,movefocus,d
# Move window
bind = SUPER_SHIFT,up,movewindow,u
bind = SUPER_SHIFT,down,movewindow,d
bind = SUPER_SHIFT,right,movewindow,r
bind = SUPER_SHIFT,left,movewindow,l
# ░█░█░█▀█░█▀▄░█░█░█▀▀░█▀█░█▀█░█▀▀░█▀▀
# ░█▄█░█░█░█▀▄░█▀▄░▀▀█░█▀▀░█▀█░█░░░█▀▀
# ░▀░▀░▀▀▀░▀░▀░▀░▀░▀▀▀░▀░░░▀░▀░▀▀▀░▀▀▀
# Switch workspaces with CTRL_ALT + [0-9]
bind = SUPER, 1, workspace, 1
bind = SUPER, 2, workspace, 2
bind = SUPER, 3, workspace, 3
bind = SUPER, 4, workspace, 4
bind = SUPER, 5, workspace, 5
bind = SUPER, 6, workspace, 6
bind = SUPER, 7, workspace, 7
bind = SUPER, 8, workspace, 8
bind = SUPER, 9, workspace, 9
# MOVING WINDOWS TO WS
bind = SUPER_SHIFT, 1, movetoworkspace, 1
bind = SUPER_SHIFT, 1, exec, $w1
bind = SUPER_SHIFT, 2, movetoworkspace, 2
bind = SUPER_SHIFT, 2, exec, $w2
bind = SUPER_SHIFT, 3, movetoworkspace, 3
bind = SUPER_SHIFT, 3, exec, $w3
bind = SUPER_SHIFT, 4, movetoworkspace, 4
bind = SUPER_SHIFT, 4, exec, $w4
bind = SUPER_SHIFT, 5, movetoworkspace, 5
bind = SUPER_SHIFT, 5, exec, $w5
bind = SUPER_SHIFT, 6, movetoworkspace, 6
bind = SUPER_SHIFT, 6, exec, $w6
bind = SUPER_SHIFT, 7, movetoworkspace, 7
bind = SUPER_SHIFT, 7, exec, $w7
bind = SUPER_SHIFT, 8, movetoworkspace, 8
bind = SUPER_SHIFT, 8, exec, $w8
bind = SUPER_SHIFT, 9, movetoworkspace, 9

# Scratchpad
bind = SUPER_SHIFT,minus,movetoworkspace,special
bind = SUPER_SHIFT,minus,togglespecialworkspace,
bind = SUPER_SHIFT,equal,togglespecialworkspace,

# ░█▄█░█▀█░█▀█░▀█▀░▀█▀░█▀█░█▀▄
# ░█░█░█░█░█░█░░█░░░█░░█░█░█▀▄
# ░▀░▀░▀▀▀░▀░▀░▀▀▀░░▀░░▀▀▀░▀░▀
# simple movement between monitors
bind = SUPER_CTRL, up, focusmonitor, u
bind = SUPER_CTRL, down, focusmonitor, d
bind = SUPER_CTRL, left, focusmonitor, l
bind = SUPER_CTRL, right, focusmonitor, r

# moving current workspace to monitor
bind = SUPER_SHIFT,down,movetoworkspace,-3
bind = SUPER_SHIFT,up,movetoworkspace,+3

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = SUPER, mouse:272, movewindow #left click
bindm = SUPER, mouse:273, resizewindow #right click

# ░█▄█░█▀▀░█▀▄░▀█▀░█▀█
# ░█░█░█▀▀░█░█░░█░░█▀█
# ░▀░▀░▀▀▀░▀▀░░▀▀▀░▀░▀
bind = $SUPER, minus, exec, ~/scripts/keybinds/sound_sink_switcher.sh
bind = , XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+ --limit 0.70
bind = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bind = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bind = , F10, exec, playerctl --player audacious previous
bind = , F11, exec, playerctl --player audacious play-pause; audacious --headless
bind = , XF86AudioMedia, exec, playerctl play-pause
bind = , XF86AudioPlay, exec, playerctl play-pause
bind = , XF86AudioStop, exec, playerctl stopmous
bind = , XF86AudioPrev, exec, playerctl previous
bind = , XF86AudioNext, exec, playerctl next

#also allows && and sleep 3 (seconds)
bindt = CONTROL, apostrophe, exec, wtype "[color=blue]\"[/color]"
bind = CTRL, Next, exec, wtype 'ゴ'
bind = CTRL, KP_Prior, exec, wtype '♪'

bind = SUPER, G, togglegroup
bind = SUPER, V, changegroupactive



# Define your main modifier key
$mainMod = SUPER # (Assuming you use SUPER for your main modifier)

# Cycle to the previous (left) window in the stack
bind = $mainMod, left, movefocus, l

# Cycle to the next (right) window in the stack
bind = $mainMod, right, movefocus, r

# Optional: You might also want to keep the up/down movements if you use a 
# floating layout or split layout sometimes
# bind = $mainMod, up, movefocus, u
# bind = $mainMod, down, movefocus, d
